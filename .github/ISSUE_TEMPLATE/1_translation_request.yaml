name: 请求翻译 / Request Translation
description: 请求翻译 linux-insides-zh 的章节 / Request a chapter translation for linux-insides-zh
title: 请求翻译
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你关注 linux-insides-zh。请填写希望翻译的章节和对应的英文原文链接。
        Thank you for your interest in linux-insides-zh. Please provide the chapter you would like translated and a link to the original English article.
  - type: textarea
    id: name
    attributes:
      label: 翻译章节 / Chapter
      placeholder: |
        请填写要翻译的章节标题或编号。
        Enter the chapter title or number.
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: 上游链接 / Upstream URL
      placeholder: |
        请填写英文原文的完整链接。
        Enter the full URL of the original English article.
    validations:
      required: true
